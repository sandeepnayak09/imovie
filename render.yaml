services:
  # ===============================================
  # iMovies Backend REST API (Render Web Service)
  # ===============================================
  - type: web
    name: imovies-api
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    plan: free
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: TMDB_API_KEY
        value: f9e6f30f4548a45cc24820d273e12ec9
      - key: RAZORPAY_KEY_ID
        value: rzp_test_TpQ7mg5jyDRTt0
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: SENDER_EMAIL
        value: sandeepnayak998182@gmail.com
      - key: SENDER_NAME
        value: iMovies
      - key: CLIENT_URL
        value: https://imovie-sooty.vercel.app

  # ===============================================
  # iMovies Frontend Client (Render Static Site)
  # ===============================================
  - type: web
    name: imovies-client
    env: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://imovies-api.onrender.com/api
